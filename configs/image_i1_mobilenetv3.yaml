# configs/image_i1_mobilenetv3.yaml — I1: MobileNetV3-Small untuk Ejaan Jari A-Z (26 Kelas, 224x224)
experiment_id: "I1_mobilenetv3_small"
seed: 42
dataset:
  root_dir: "data/fingerspelling_crops"
  image_size: 224
  num_classes: 26
model:
  arch: "mobilenetv3_small"
  num_classes: 26
  dropout: 0.2
training:
  epochs: 25
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.01
  label_smoothing: 0.05
output_dir: "runs/image_i1_mobilenetv3"
export_onnx_path: "web/model/fingerspell.onnx"

