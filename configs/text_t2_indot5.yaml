# configs/text_t2_indot5.yaml — T2: IndoT5-small Fine-tuned Gloss -> Kalimat Indonesia
experiment_id: "T2_indot5_small_ft"
seed: 42
model_type: "indot5"
pretrained_name: "LazarusNLP/IndoNanoT5-base"
